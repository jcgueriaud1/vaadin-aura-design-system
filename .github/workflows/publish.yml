name: Publish design system

on:
  release:
    types: [published]   # create a GitHub Release with tag vX.Y.Z to publish
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jcgueriaud1'
          cache: npm

      - name: Install
        run: npm ci

      # Sanity check before publishing: tokens must be valid DTCG and every
      # reference must resolve within the base system itself.
      - name: Validate tokens
        run: npm run validate

      - name: Test the validator
        run: npm test

      - name: Check version matches tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) != release tag ($TAG)"; exit 1
          fi

      # Manual runs exercise the whole pipeline without shipping anything, so the
      # workflow can be proven green before there is a release to cut.
      - name: Dry-run publish
        if: github.event_name != 'release'
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name == 'release'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
