name: Publish design system

on:
  release:
    types: [published]   # create a GitHub Release with tag vX.Y.Z to publish
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@yourorg'

      # Sanity checks before publishing: tokens must be valid JSON and every
      # DTCG reference must resolve within the base system itself.
      - name: Validate tokens
        run: |
          npm ci
          node -e "
            import('style-dictionary').then(async ({ default: SD }) => {
              const sd = new SD({ usesDtcg: true, source: ['tokens/tokens.json'], platforms: {} });
              await sd.hasInitialized;
              console.log('tokens.json valid, all references resolvable');
            }).catch(e => { console.error(e.message); process.exit(1); });
          "

      - name: Check version matches tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) != release tag ($TAG)"; exit 1
          fi

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
